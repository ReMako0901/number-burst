<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>NUMBER BURST</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030408; }
    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    #count {
      color: #fff;
      font-weight: 1000;
      line-height: .9;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow:
        0 0 18px rgba(120, 220, 255, .8),
        0 0 54px rgba(80, 120, 255, .48),
        0 4px 18px rgba(0, 0, 0, .65);
      transform-origin: center;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud"><div id="count">1</div></div>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    const MAX_BALLS = 1000;
    const BALL_RADIUS = 0.085;
    const ARENA_WIDTH = 6.5;
    const ARENA_DEPTH = 4.2;
    const ARENA_HEIGHT = 3.2;
    const HALF_WIDTH = ARENA_WIDTH / 2;
    const HALF_DEPTH = ARENA_DEPTH / 2;
    const SPLIT_COOLDOWN_MS = 500;
    const FIXED_STEP = 1 / 60;
    const BALL_GROUP = 1;
    const BOUNDARY_GROUP = 2;
    const SPARK_COUNT = 900;
    const SPARKS_PER_SPLIT = 7;

    const countElement = document.getElementById('count');
    const balls = [];
    const clock = new THREE.Clock();
    const palette = [
      new THREE.Color(0x5df8ff),
      new THREE.Color(0xff67e7),
      new THREE.Color(0x9dff5a),
      new THREE.Color(0xffd75d),
      new THREE.Color(0x8b95ff),
      new THREE.Color(0xff788e)
    ];

    let ballCount = 0;
    let displayedBallCount = -1;
    let resizeTimer = 0;
    let tapTimer = 0;
    let lastTapTime = 0;
    let lastTapX = 0;
    let lastTapY = 0;
    let activePointers = new Set();
    let audioContext = null;
    let lastTickTime = 0;

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030408);

    const camera = new THREE.PerspectiveCamera(
      56,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 5.5, 16.2);
    camera.lookAt(0, 0.9, 0);

    const arenaMaterial = new THREE.MeshBasicMaterial({
      color: 0x64d9ff,
      transparent: true,
      opacity: 0.085,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const arenaFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(ARENA_WIDTH, ARENA_DEPTH),
      arenaMaterial
    );
    arenaFloor.rotation.x = -Math.PI / 2;
    arenaFloor.position.y = 0.01;
    arenaFloor.renderOrder = 2;
    scene.add(arenaFloor);

    function addArenaWall(x, z, width, depth) {
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(width, ARENA_HEIGHT, depth),
        arenaMaterial
      );
      wall.position.set(x, ARENA_HEIGHT / 2, z);
      wall.renderOrder = 2;
      scene.add(wall);
    }

    addArenaWall(0, -HALF_DEPTH, ARENA_WIDTH + 0.16, 0.12);
    addArenaWall(0, HALF_DEPTH, ARENA_WIDTH + 0.16, 0.12);
    addArenaWall(-HALF_WIDTH, 0, 0.12, ARENA_DEPTH);
    addArenaWall(HALF_WIDTH, 0, 0.12, ARENA_DEPTH);

    const arenaEdges = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(ARENA_WIDTH, ARENA_HEIGHT, ARENA_DEPTH)),
      new THREE.LineBasicMaterial({
        color: 0x8cefff,
        transparent: true,
        opacity: 0.72
      })
    );
    arenaEdges.position.y = ARENA_HEIGHT / 2;
    scene.add(arenaEdges);

    const world = new CANNON.World({
      gravity: new CANNON.Vec3(0, -3.2, 0)
    });
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.solver.iterations = 4;
    world.allowSleep = false;

    const ballMaterial = new CANNON.Material('ball');
    const boundaryMaterial = new CANNON.Material('boundary');
    world.addContactMaterial(new CANNON.ContactMaterial(ballMaterial, boundaryMaterial, {
      friction: 0,
      restitution: 1
    }));

    function addBoundaryBody(shape, position, normal) {
      const body = new CANNON.Body({
        mass: 0,
        material: boundaryMaterial,
        shape,
        position,
        collisionFilterGroup: BOUNDARY_GROUP,
        collisionFilterMask: BALL_GROUP
      });
      body.arenaNormal = normal;
      world.addBody(body);
      return body;
    }

    addBoundaryBody(
      new CANNON.Box(new CANNON.Vec3(HALF_WIDTH, 0.1, HALF_DEPTH)),
      new CANNON.Vec3(0, -0.1, 0),
      new CANNON.Vec3(0, 1, 0)
    );
    addBoundaryBody(
      new CANNON.Box(new CANNON.Vec3(HALF_WIDTH + 0.08, ARENA_HEIGHT / 2, 0.08)),
      new CANNON.Vec3(0, ARENA_HEIGHT / 2, -HALF_DEPTH - 0.08),
      new CANNON.Vec3(0, 0, 1)
    );
    addBoundaryBody(
      new CANNON.Box(new CANNON.Vec3(HALF_WIDTH + 0.08, ARENA_HEIGHT / 2, 0.08)),
      new CANNON.Vec3(0, ARENA_HEIGHT / 2, HALF_DEPTH + 0.08),
      new CANNON.Vec3(0, 0, -1)
    );
    addBoundaryBody(
      new CANNON.Box(new CANNON.Vec3(0.08, ARENA_HEIGHT / 2, HALF_DEPTH)),
      new CANNON.Vec3(-HALF_WIDTH - 0.08, ARENA_HEIGHT / 2, 0),
      new CANNON.Vec3(1, 0, 0)
    );
    addBoundaryBody(
      new CANNON.Box(new CANNON.Vec3(0.08, ARENA_HEIGHT / 2, HALF_DEPTH)),
      new CANNON.Vec3(HALF_WIDTH + 0.08, ARENA_HEIGHT / 2, 0),
      new CANNON.Vec3(-1, 0, 0)
    );

    const sharedSphereShape = new CANNON.Sphere(BALL_RADIUS);
    const ballGeometry = new THREE.SphereGeometry(BALL_RADIUS, 10, 7);
    const ballMeshMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      toneMapped: false
    });
    const ballMesh = new THREE.InstancedMesh(ballGeometry, ballMeshMaterial, MAX_BALLS);
    ballMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    ballMesh.count = 0;
    ballMesh.frustumCulled = false;
    scene.add(ballMesh);

    const sparkPositions = new Float32Array(SPARK_COUNT * 3);
    const sparkVelocities = new Float32Array(SPARK_COUNT * 3);
    const sparkLifetimes = new Float32Array(SPARK_COUNT);
    const sparkAges = new Float32Array(SPARK_COUNT);
    const sparkBaseColors = new Float32Array(SPARK_COUNT * 3);
    const sparkColors = new Float32Array(SPARK_COUNT * 3);
    let sparkCursor = 0;

    const sparkGeometry = new THREE.BufferGeometry();
    sparkGeometry.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
    sparkGeometry.setAttribute('color', new THREE.BufferAttribute(sparkColors, 3));
    const sparkMaterial = new THREE.PointsMaterial({
      size: 0.11,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const sparks = new THREE.Points(sparkGeometry, sparkMaterial);
    sparks.frustumCulled = false;
    scene.add(sparks);

    function randomRange(minimum, maximum) {
      return minimum + Math.random() * (maximum - minimum);
    }

    function fitCounter() {
      const text = countElement.textContent;
      const baseSize = Math.min(
        window.innerWidth * 0.2,
        window.innerHeight * 0.2,
        170
      );
      const characterWidthRatio = 0.58;
      const fittedSize = Math.min(
        baseSize,
        (window.innerWidth * 0.88) / (text.length * characterWidthRatio)
      );
      countElement.style.fontSize = `${Math.max(30, fittedSize)}px`;
    }

    function refreshCountDisplay() {
      if (displayedBallCount === ballCount) return;
      displayedBallCount = ballCount;
      countElement.textContent = ballCount.toLocaleString('en-US');
      fitCounter();
    }

    function ensureAudio() {
      const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextConstructor) return;
      if (!audioContext) {
        try {
          audioContext = new AudioContextConstructor();
        } catch (error) {
          audioContext = null;
          return;
        }
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }
    }

    function playTick() {
      if (!audioContext || audioContext.state !== 'running') return;
      const now = audioContext.currentTime;
      if (now - lastTickTime < 0.045) return;
      lastTickTime = now;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const intensity = Math.sqrt(Math.min(1, ballCount / MAX_BALLS));
      oscillator.type = 'triangle';
      oscillator.frequency.value = 285 + 515 * intensity;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.05, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.08);
    }

    function emitSparks(position, color) {
      for (let index = 0; index < SPARKS_PER_SPLIT; index++) {
        const sparkIndex = sparkCursor % SPARK_COUNT;
        sparkCursor++;
        const positionOffset = sparkIndex * 3;
        sparkPositions[positionOffset] = position.x + randomRange(-0.03, 0.03);
        sparkPositions[positionOffset + 1] = position.y + randomRange(-0.03, 0.03);
        sparkPositions[positionOffset + 2] = position.z + randomRange(-0.03, 0.03);

        const angle = Math.random() * Math.PI * 2;
        const elevation = randomRange(-0.7, 1.0);
        const speed = randomRange(0.9, 2.0);
        sparkVelocities[positionOffset] = Math.cos(angle) * speed;
        sparkVelocities[positionOffset + 1] = elevation * speed * 0.7;
        sparkVelocities[positionOffset + 2] = Math.sin(angle) * speed;
        sparkLifetimes[sparkIndex] = randomRange(0.28, 0.48);
        sparkAges[sparkIndex] = 0;
        sparkBaseColors[positionOffset] = color.r;
        sparkBaseColors[positionOffset + 1] = color.g;
        sparkBaseColors[positionOffset + 2] = color.b;
      }
    }

    function updateSparks(delta) {
      for (let index = 0; index < SPARK_COUNT; index++) {
        if (sparkLifetimes[index] === 0) continue;
        sparkAges[index] += delta;
        const progress = sparkAges[index] / sparkLifetimes[index];
        const offset = index * 3;
        if (progress >= 1) {
          sparkLifetimes[index] = 0;
          sparkColors[offset] = 0;
          sparkColors[offset + 1] = 0;
          sparkColors[offset + 2] = 0;
          continue;
        }

        sparkPositions[offset] += sparkVelocities[offset] * delta;
        sparkPositions[offset + 1] += sparkVelocities[offset + 1] * delta;
        sparkPositions[offset + 2] += sparkVelocities[offset + 2] * delta;
        sparkVelocities[offset + 1] -= 1.8 * delta;
        const fade = 1 - progress;
        sparkColors[offset] = sparkBaseColors[offset] * fade;
        sparkColors[offset + 1] = sparkBaseColors[offset + 1] * fade;
        sparkColors[offset + 2] = sparkBaseColors[offset + 2] * fade;
      }

      sparkGeometry.attributes.position.needsUpdate = true;
      sparkGeometry.attributes.color.needsUpdate = true;
    }

    function clampPosition(body) {
      const limitX = HALF_WIDTH - BALL_RADIUS;
      const limitZ = HALF_DEPTH - BALL_RADIUS;
      if (body.position.x < -limitX) {
        body.position.x = -limitX;
        body.velocity.x = Math.abs(body.velocity.x);
      } else if (body.position.x > limitX) {
        body.position.x = limitX;
        body.velocity.x = -Math.abs(body.velocity.x);
      }
      if (body.position.z < -limitZ) {
        body.position.z = -limitZ;
        body.velocity.z = Math.abs(body.velocity.z);
      } else if (body.position.z > limitZ) {
        body.position.z = limitZ;
        body.velocity.z = -Math.abs(body.velocity.z);
      }
      if (body.position.y < BALL_RADIUS) {
        body.position.y = BALL_RADIUS;
        body.velocity.y = Math.abs(body.velocity.y);
      }
    }

    function regulateVelocity(body) {
      const velocity = body.velocity;
      const horizontalSpeed = Math.hypot(velocity.x, velocity.z);
      if (horizontalSpeed > 0.0001) {
        const targetSpeed = horizontalSpeed < 3.4
          ? 4.0
          : horizontalSpeed > 4.8
            ? 4.4
            : horizontalSpeed;
        const scale = targetSpeed / horizontalSpeed;
        velocity.x *= scale;
        velocity.z *= scale;
      } else {
        velocity.x = randomRange(-4.0, 4.0);
        velocity.z = randomRange(-2.5, 2.5);
      }

      if (body.position.y <= BALL_RADIUS + 0.04 && velocity.y < 2.25) {
        velocity.y = Math.max(2.5, Math.abs(velocity.y));
      } else if (Math.abs(velocity.y) > 3.6) {
        velocity.y = Math.sign(velocity.y) * 3.6;
      }
    }

    function createBallBody(position, velocity) {
      const body = new CANNON.Body({
        mass: 0.04,
        material: ballMaterial,
        shape: sharedSphereShape,
        position,
        velocity,
        linearDamping: 0,
        angularDamping: 0.9,
        allowSleep: false,
        collisionFilterGroup: BALL_GROUP,
        collisionFilterMask: BOUNDARY_GROUP
      });
      body.lastSplitAt = performance.now();
      body.addEventListener('collide', handleBallCollision);
      world.addBody(body);
      return body;
    }

    function createInitialBall() {
      const position = new CANNON.Vec3(0, 0.55, 0);
      const velocity = new CANNON.Vec3(
        randomRange(-3.0, 3.0),
        randomRange(2.6, 3.2),
        randomRange(-1.9, 1.9)
      );
      const body = createBallBody(position, velocity);
      const color = palette[balls.length % palette.length];
      balls.push({ body, color });
      ballMesh.setColorAt(0, color);
      if (ballMesh.instanceColor) ballMesh.instanceColor.needsUpdate = true;
      ballCount = 1;
    }

    function handleBallCollision(event) {
      const parent = this;
      const now = performance.now();
      if (now - parent.lastSplitAt < SPLIT_COOLDOWN_MS) return;
      if (balls.length >= MAX_BALLS) return;

      const boundary = event.body;
      if (!boundary || !boundary.arenaNormal) return;
      const normal = boundary.arenaNormal;
      const separation = BALL_RADIUS * 2.2;
      const position = new CANNON.Vec3(
        parent.position.x + normal.x * separation + randomRange(-0.03, 0.03),
        parent.position.y + normal.y * separation + randomRange(-0.02, 0.02),
        parent.position.z + normal.z * separation + randomRange(-0.03, 0.03)
      );
      position.x = Math.min(HALF_WIDTH - BALL_RADIUS, Math.max(-HALF_WIDTH + BALL_RADIUS, position.x));
      position.z = Math.min(HALF_DEPTH - BALL_RADIUS, Math.max(-HALF_DEPTH + BALL_RADIUS, position.z));
      position.y = Math.max(BALL_RADIUS, Math.min(ARENA_HEIGHT - BALL_RADIUS, position.y));

      const velocity = new CANNON.Vec3(
        parent.velocity.x + randomRange(-0.7, 0.7),
        Math.min(3.6, Math.max(2.5, parent.velocity.y + randomRange(-0.4, 0.4))),
        parent.velocity.z + randomRange(-0.45, 0.45)
      );
      const child = createBallBody(position, velocity);
      child.lastSplitAt = now;
      parent.lastSplitAt = now;
      regulateVelocity(child);

      const color = palette[balls.length % palette.length];
      balls.push({ body: child, color });
      ballCount = balls.length;
      ballMesh.setColorAt(balls.length - 1, color);
      if (ballMesh.instanceColor) ballMesh.instanceColor.needsUpdate = true;
      emitSparks(parent.position, color);
      playTick();
    }

    function addBallFromTap() {
      if (balls.length >= MAX_BALLS) return;
      const position = new CANNON.Vec3(
        randomRange(-2.4, 2.4),
        randomRange(0.5, 1.2),
        randomRange(-1.4, 1.4)
      );
      const velocity = new CANNON.Vec3(
        randomRange(-4.0, 4.0),
        randomRange(2.6, 3.3),
        randomRange(-2.5, 2.5)
      );
      const body = createBallBody(position, velocity);
      regulateVelocity(body);
      const color = palette[balls.length % palette.length];
      balls.push({ body, color });
      ballCount = balls.length;
      ballMesh.setColorAt(balls.length - 1, color);
      if (ballMesh.instanceColor) ballMesh.instanceColor.needsUpdate = true;
      emitSparks(position, color);
    }

    function resetBalls() {
      for (const ball of balls) {
        ball.body.removeEventListener('collide', handleBallCollision);
        world.removeBody(ball.body);
      }
      balls.length = 0;
      ballMesh.count = 0;
      createInitialBall();
    }

    function updateBallMesh() {
      const matrix = new THREE.Matrix4();
      for (let index = 0; index < balls.length; index++) {
        const body = balls[index].body;
        matrix.makeTranslation(body.position.x, body.position.y, body.position.z);
        ballMesh.setMatrixAt(index, matrix);
      }
      ballMesh.count = balls.length;
      ballMesh.instanceMatrix.needsUpdate = true;
    }

    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      fitCounter();
    }

    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(onResize, 120);
    });

    window.addEventListener('pointerdown', event => {
      event.preventDefault();
      ensureAudio();
      activePointers.add(event.pointerId);
      if (activePointers.size > 1) {
        clearTimeout(tapTimer);
        tapTimer = 0;
        return;
      }

      const now = performance.now();
      const tapDistance = Math.hypot(event.clientX - lastTapX, event.clientY - lastTapY);
      if (now - lastTapTime <= 280 && tapDistance < 40) {
        clearTimeout(tapTimer);
        tapTimer = 0;
        lastTapTime = 0;
        resetBalls();
        playTick();
        return;
      }

      lastTapTime = now;
      lastTapX = event.clientX;
      lastTapY = event.clientY;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => {
        tapTimer = 0;
        addBallFromTap();
      }, 300);
    });

    window.addEventListener('pointerup', event => activePointers.delete(event.pointerId));
    window.addEventListener('pointercancel', event => activePointers.delete(event.pointerId));
    window.addEventListener('contextmenu', event => event.preventDefault());

    createInitialBall();
    onResize();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      world.step(FIXED_STEP, delta, 2);

      for (const ball of balls) {
        regulateVelocity(ball.body);
        clampPosition(ball.body);
      }
      updateBallMesh();
      refreshCountDisplay();
      updateSparks(delta);
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
