<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>NUMBER BURST</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030408;
    }
    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas { display: block; }
    #count {
      position: fixed;
      top: max(16px, 3vh);
      left: 0;
      right: 0;
      color: #fff;
      font-weight: 900;
      line-height: .92;
      letter-spacing: -.045em;
      font-variant-numeric: tabular-nums;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      text-shadow:
        0 0 18px rgba(120, 220, 255, .82),
        0 0 56px rgba(80, 120, 255, .46),
        0 4px 20px rgba(0, 0, 0, .68);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
</head>
<body>
  <div id="count">0</div>
  <canvas id="stage"></canvas>

  <script>
    const {
      Bodies,
      Body,
      Composite,
      Engine,
      Events
    } = Matter;

    const BOARD_WIDTH = 393;
    const BOARD_HEIGHT = 850;
    const WALL_THICKNESS = 20;
    const MAX_BALLS = 1500;
    const BALL_RADIUS = BOARD_WIDTH * 0.015;
    const SPLIT_COOLDOWN_MS = 500;
    const MAX_SPEED = 11.5;
    const FIXED_STEP = 1000 / 60;
    const WALL_CATEGORY = 0x0001;
    const BALL_CATEGORY = 0x0002;
    const DOUBLE_TAP_MS = 320;
    const DOUBLE_TAP_DISTANCE = 42;

    const canvas = document.getElementById('stage');
    const context = canvas.getContext('2d');
    const countElement = document.getElementById('count');
    const measurementContext = document.createElement('canvas').getContext('2d');

    const palette = [
      { core: 'rgba(255,255,255,1)', glow: '#5df8ff' },
      { core: 'rgba(255,255,255,1)', glow: '#ff67e7' },
      { core: 'rgba(255,255,255,1)', glow: '#9dff5a' },
      { core: 'rgba(255,255,255,1)', glow: '#ffd75d' },
      { core: 'rgba(255,255,255,1)', glow: '#8b95ff' },
      { core: 'rgba(255,255,255,1)', glow: '#ff788e' }
    ];
    const ballSprites = palette.map(makeBallSprite);
    const obstacles = [];
    const balls = [];
    const pendingSplits = [];
    const sparks = new Array(900);

    const queuedBall = {
      x: BOARD_WIDTH * 0.5,
      y: 170,
      colorIndex: 0
    };

    const engine = Engine.create({
      enableSleeping: false,
      positionIterations: 4,
      velocityIterations: 3,
      constraintIterations: 1
    });
    const world = engine.world;
    const wallOptions = {
      isStatic: true,
      restitution: 0.99,
      friction: 0,
      frictionStatic: 0,
      collisionFilter: {
        category: WALL_CATEGORY,
        mask: BALL_CATEGORY
      }
    };

    let launched = false;
    let sparkCursor = 0;
    let lastTapTime = 0;
    let lastTapX = 0;
    let lastTapY = 0;
    let lastWakeTime = 0;
    let lastTickTime = 0;
    let lastCountLength = 1;
    let audioContext = null;
    let canvasWidth = 1;
    let canvasHeight = 1;
    let devicePixelRatio = 1;
    let boardScale = 1;
    let boardOffsetX = 0;
    let boardOffsetY = 0;

    for (let index = 0; index < sparks.length; index++) {
      sparks[index] = { life: 0 };
    }

    addOuterWalls();
    addAngledBar(82, 190, 180, 14, -0.38, '#5df8ff');
    addAngledBar(312, 325, 168, 14, 0.42, '#ff67e7');
    addAngledBar(100, 500, 188, 14, 0.34, '#9dff5a');
    addAngledBar(288, 675, 160, 14, -0.45, '#ffd75d');
    addTriangle(188, 402, 56, 0.22, '#8b95ff');
    addTriangle(302, 580, 44, -0.18, '#ff788e');
    addPeg(62, 110, 14, '#5df8ff');
    addPeg(330, 155, 10, '#ff67e7');
    addPeg(178, 270, 12, '#9dff5a');
    addPeg(78, 615, 18, '#ffd75d');
    addPeg(314, 778, 12, '#8b95ff');
    addGappedBar(38, 442, 124, 12, '#ff788e');
    addGappedBar(252, 442, 102, 12, '#ff788e');
    addDiamond(197, 728, 54, '#5df8ff');

    Events.on(engine, 'collisionStart', handleCollisions);
    window.addEventListener('resize', resize, { passive: true });
    window.addEventListener('orientationchange', resize, { passive: true });
    window.addEventListener('pointerdown', handlePointerDown);
    window.addEventListener('contextmenu', event => event.preventDefault());

    resize();
    refreshCountDisplay(true);
    requestAnimationFrame(animationFrame);

    function addOuterWalls() {
      Composite.add(world, [
        Bodies.rectangle(-WALL_THICKNESS / 2, BOARD_HEIGHT / 2, WALL_THICKNESS, BOARD_HEIGHT + WALL_THICKNESS * 2, wallOptions),
        Bodies.rectangle(BOARD_WIDTH + WALL_THICKNESS / 2, BOARD_HEIGHT / 2, WALL_THICKNESS, BOARD_HEIGHT + WALL_THICKNESS * 2, wallOptions),
        Bodies.rectangle(BOARD_WIDTH / 2, -WALL_THICKNESS / 2, BOARD_WIDTH + WALL_THICKNESS * 2, WALL_THICKNESS, wallOptions),
        Bodies.rectangle(BOARD_WIDTH / 2, BOARD_HEIGHT + WALL_THICKNESS / 2, BOARD_WIDTH + WALL_THICKNESS * 2, WALL_THICKNESS, wallOptions)
      ]);
    }

    function addObstacle(body, color) {
      Composite.add(world, body);
      obstacles.push({ body, color });
    }

    function addAngledBar(x, y, width, height, angle, color) {
      addObstacle(Bodies.rectangle(x, y, width, height, {
        ...wallOptions,
        angle
      }), color);
    }

    function addTriangle(x, y, radius, angle, color) {
      addObstacle(Bodies.polygon(x, y, 3, radius, {
        ...wallOptions,
        angle
      }), color);
    }

    function addPeg(x, y, radius, color) {
      addObstacle(Bodies.circle(x, y, radius, wallOptions), color);
    }

    function addGappedBar(x, y, width, height, color) {
      addObstacle(Bodies.rectangle(x, y, width, height, wallOptions), color);
    }

    function addDiamond(x, y, size, color) {
      addObstacle(Bodies.rectangle(x, y, size, size, {
        ...wallOptions,
        angle: Math.PI / 4
      }), color);
    }

    function handleCollisions(event) {
      const now = performance.now();

      for (const pair of event.pairs) {
        const parent = pair.bodyA.plugin.isBall ? pair.bodyA : pair.bodyB;
        if (!parent.plugin.isBall) continue;
        if (now - parent.plugin.lastSplitAt < SPLIT_COOLDOWN_MS) continue;
        if (balls.length + pendingSplits.length >= MAX_BALLS) continue;

        parent.plugin.lastSplitAt = now;
        const normal = pair.collision.normal;
        const towardOpenSpace = pair.bodyA === parent ? -1 : 1;
        const separation = BALL_RADIUS * 2.35;
        pendingSplits.push({
          parent,
          x: parent.position.x + normal.x * towardOpenSpace * separation + randomRange(-1.5, 1.5),
          y: parent.position.y + normal.y * towardOpenSpace * separation + randomRange(-1.5, 1.5)
        });
      }
    }

    function createBallBody(x, y, velocityX, velocityY, colorIndex, lastSplitAt) {
      const body = Bodies.circle(x, y, BALL_RADIUS, {
        restitution: 0.99,
        friction: 0,
        frictionStatic: 0,
        frictionAir: 0,
        slop: 0.03,
        collisionFilter: {
          category: BALL_CATEGORY,
          mask: WALL_CATEGORY
        },
        plugin: {
          isBall: true,
          lastSplitAt,
          colorIndex
        }
      });
      Body.setVelocity(body, { x: velocityX, y: velocityY });
      Composite.add(world, body);
      return body;
    }

    function processPendingSplits(now) {
      while (pendingSplits.length > 0) {
        if (balls.length >= MAX_BALLS) break;
        const request = pendingSplits.shift();
        const x = clamp(request.x, BALL_RADIUS, BOARD_WIDTH - BALL_RADIUS);
        const y = clamp(request.y, BALL_RADIUS, BOARD_HEIGHT - BALL_RADIUS);
        const parentVelocity = request.parent.velocity;
        const colorIndex = balls.length % palette.length;
        const velocityX = parentVelocity.x + randomRange(-1.6, 1.6);
        const velocityY = parentVelocity.y + randomRange(-1.1, 1.5);
        const body = createBallBody(x, y, velocityX, velocityY, colorIndex, now);
        balls.push(body);
        limitVelocity(body);
        emitSparks(request.parent.position.x, request.parent.position.y, colorIndex);
      }
      refreshCountDisplay();
    }

    function launchInitialBall() {
      const velocityX = randomRange(-3.8, 3.8);
      const velocityY = randomRange(4.8, 7.2);
      const now = performance.now();
      const body = createBallBody(
        queuedBall.x,
        queuedBall.y,
        velocityX,
        velocityY,
        queuedBall.colorIndex,
        now
      );
      balls.push(body);
      launched = true;
      refreshCountDisplay();
    }

    function resetBalls() {
      for (const body of balls) {
        Composite.remove(world, body);
      }
      balls.length = 0;
      pendingSplits.length = 0;
      launched = false;
      for (const spark of sparks) spark.life = 0;
      refreshCountDisplay(true);
    }

    function handlePointerDown(event) {
      event.preventDefault();
      ensureAudio();
      const now = performance.now();
      const tapDistance = Math.hypot(event.clientX - lastTapX, event.clientY - lastTapY);
      const isDoubleTap = launched && now - lastTapTime <= DOUBLE_TAP_MS && tapDistance <= DOUBLE_TAP_DISTANCE;

      if (isDoubleTap) {
        resetBalls();
        lastTapTime = 0;
        return;
      }

      lastTapTime = now;
      lastTapX = event.clientX;
      lastTapY = event.clientY;
      if (!launched) launchInitialBall();
    }

    function randomRange(minimum, maximum) {
      return minimum + Math.random() * (maximum - minimum);
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function wakeSlowBalls(now) {
      if (now - lastWakeTime < 120) return;
      lastWakeTime = now;

      for (const body of balls) {
        const speed = Math.hypot(body.velocity.x, body.velocity.y);
        if (speed < 1.9) {
          Body.applyForce(body, body.position, {
            x: body.mass * randomRange(-0.0025, 0.0025),
            y: body.mass * randomRange(-0.004, -0.0005)
          });
        }
      }
    }

    function limitVelocities() {
      for (const body of balls) limitVelocity(body);
    }

    function limitVelocity(body) {
      const speed = Math.hypot(body.velocity.x, body.velocity.y);
      if (speed <= MAX_SPEED) return;
      const scale = MAX_SPEED / speed;
      Body.setVelocity(body, {
        x: body.velocity.x * scale,
        y: body.velocity.y * scale
      });
    }

    function ensureAudio() {
      const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextConstructor) return;

      if (!audioContext) {
        try {
          audioContext = new AudioContextConstructor();
        } catch (error) {
          audioContext = null;
          return;
        }
      }

      if (audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }
    }

    function playTick() {
      if (!audioContext || audioContext.state !== 'running') return;
      const now = audioContext.currentTime;
      if (now - lastTickTime < 0.045) return;
      lastTickTime = now;

      const intensity = Math.min(1, balls.length / MAX_BALLS);
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = 'triangle';
      oscillator.frequency.value = 280 + 440 * intensity;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.04, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.085);
    }

    function emitSparks(x, y, colorIndex) {
      const color = palette[colorIndex].glow;
      for (let count = 0; count < 5; count++) {
        const spark = sparks[sparkCursor % sparks.length];
        sparkCursor++;
        const angle = Math.random() * Math.PI * 2;
        const speed = randomRange(32, 82);
        spark.x = x + randomRange(-3, 3);
        spark.y = y + randomRange(-3, 3);
        spark.velocityX = Math.cos(angle) * speed;
        spark.velocityY = Math.sin(angle) * speed - 24;
        spark.life = randomRange(0.24, 0.42);
        spark.age = 0;
        spark.size = randomRange(2.5, 4.5);
        spark.sprite = makeColoredSparkSprite(color);
      }
      playTick();
    }

    function updateSparks(deltaSeconds) {
      for (const spark of sparks) {
        if (!spark.life) continue;
        spark.age += deltaSeconds;
        if (spark.age >= spark.life) {
          spark.life = 0;
          continue;
        }
        spark.x += spark.velocityX * deltaSeconds;
        spark.y += spark.velocityY * deltaSeconds;
        spark.velocityY += 70 * deltaSeconds;
      }
    }

    function makeBallSprite(color) {
      const sprite = document.createElement('canvas');
      const size = 48;
      sprite.width = size;
      sprite.height = size;
      const spriteContext = sprite.getContext('2d');
      const radius = size / 2;
      const gradient = spriteContext.createRadialGradient(radius, radius, 0, radius, radius, radius);
      gradient.addColorStop(0, color.core);
      gradient.addColorStop(0.25, color.glow);
      gradient.addColorStop(0.54, hexToRgba(color.glow, 0.35));
      gradient.addColorStop(1, hexToRgba(color.glow, 0));
      spriteContext.fillStyle = gradient;
      spriteContext.fillRect(0, 0, size, size);
      return sprite;
    }

    function makeColoredSparkSprite(color) {
      if (makeColoredSparkSprite.cache.has(color)) {
        return makeColoredSparkSprite.cache.get(color);
      }

      const sprite = document.createElement('canvas');
      sprite.width = 32;
      sprite.height = 32;
      const spriteContext = sprite.getContext('2d');
      const gradient = spriteContext.createRadialGradient(16, 16, 0, 16, 16, 16);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.32, color);
      gradient.addColorStop(1, hexToRgba(color, 0));
      spriteContext.fillStyle = gradient;
      spriteContext.fillRect(0, 0, 32, 32);
      makeColoredSparkSprite.cache.set(color, sprite);
      return sprite;
    }

    makeColoredSparkSprite.cache = new Map();

    function hexToRgba(hex, alpha) {
      const value = parseInt(hex.slice(1), 16);
      return `rgba(${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}, ${alpha})`;
    }

    function resize() {
      canvasWidth = window.innerWidth;
      canvasHeight = window.innerHeight;
      devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(canvasWidth * devicePixelRatio);
      canvas.height = Math.round(canvasHeight * devicePixelRatio);
      canvas.style.width = `${canvasWidth}px`;
      canvas.style.height = `${canvasHeight}px`;
      boardScale = Math.min(canvasWidth / BOARD_WIDTH, canvasHeight / BOARD_HEIGHT);
      boardOffsetX = (canvasWidth - BOARD_WIDTH * boardScale) / 2;
      boardOffsetY = (canvasHeight - BOARD_HEIGHT * boardScale) / 2;
      refreshCountDisplay(true);
    }

    function refreshCountDisplay(forceFit = false) {
      const text = balls.length.toLocaleString('en-US');
      countElement.textContent = text;
      if (forceFit || text.length !== lastCountLength) {
        lastCountLength = text.length;
        fitCounter(text);
      }
    }

    function fitCounter(text) {
      const availableWidth = Math.max(72, Math.min(canvasWidth * 0.92, BOARD_WIDTH * boardScale * 0.94));
      const maximumSize = Math.min(124, canvasHeight * 0.155);
      let fontSize = maximumSize;
      measurementContext.font = `900 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      const measuredWidth = measurementContext.measureText(text).width;
      if (measuredWidth > availableWidth) {
        fontSize = Math.max(24, fontSize * availableWidth / measuredWidth);
      }
      countElement.style.fontSize = `${fontSize.toFixed(2)}px`;
    }

    function animationFrame(timestamp) {
      Engine.update(engine, FIXED_STEP);
      processPendingSplits(performance.now());
      wakeSlowBalls(performance.now());
      limitVelocities();
      updateSparks(FIXED_STEP / 1000);
      draw();
      requestAnimationFrame(animationFrame);
    }

    function draw() {
      context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      context.clearRect(0, 0, canvasWidth, canvasHeight);
      context.fillStyle = '#030408';
      context.fillRect(0, 0, canvasWidth, canvasHeight);

      context.save();
      context.translate(boardOffsetX, boardOffsetY);
      context.scale(boardScale, boardScale);
      drawBoard();
      drawObstacles();
      drawSparks();
      drawBalls();
      context.restore();
    }

    function drawBoard() {
      const gradient = context.createLinearGradient(0, 0, 0, BOARD_HEIGHT);
      gradient.addColorStop(0, '#050718');
      gradient.addColorStop(0.55, '#050b1b');
      gradient.addColorStop(1, '#030713');
      context.fillStyle = gradient;
      context.fillRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);

      context.save();
      context.beginPath();
      context.rect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
      context.clip();
      context.strokeStyle = 'rgba(93, 248, 255, .055)';
      context.lineWidth = 1;
      context.beginPath();
      for (let x = 39.3; x < BOARD_WIDTH; x += 39.3) {
        context.moveTo(x, 0);
        context.lineTo(x, BOARD_HEIGHT);
      }
      for (let y = 42.5; y < BOARD_HEIGHT; y += 42.5) {
        context.moveTo(0, y);
        context.lineTo(BOARD_WIDTH, y);
      }
      context.stroke();
      context.restore();

      context.save();
      context.shadowColor = 'rgba(93, 248, 255, .9)';
      context.shadowBlur = 14;
      context.strokeStyle = 'rgba(150, 245, 255, .95)';
      context.lineWidth = 3.5;
      context.strokeRect(1.75, 1.75, BOARD_WIDTH - 3.5, BOARD_HEIGHT - 3.5);
      context.restore();
    }

    function drawObstacles() {
      for (const obstacle of obstacles) {
        const body = obstacle.body;
        context.save();
        context.shadowColor = obstacle.color;
        context.shadowBlur = 11;
        context.strokeStyle = obstacle.color;
        context.fillStyle = 'rgba(8, 22, 38, .68)';
        context.lineWidth = 2.5;
        context.lineJoin = 'round';

        if (body.circleRadius) {
          context.beginPath();
          context.arc(body.position.x, body.position.y, body.circleRadius, 0, Math.PI * 2);
          context.fill();
          context.stroke();
        } else {
          const vertices = body.vertices;
          context.beginPath();
          context.moveTo(vertices[0].x, vertices[0].y);
          for (let index = 1; index < vertices.length; index++) {
            context.lineTo(vertices[index].x, vertices[index].y);
          }
          context.closePath();
          context.fill();
          context.stroke();
        }
        context.restore();
      }
    }

    function drawSparks() {
      context.save();
      context.globalCompositeOperation = 'lighter';
      for (const spark of sparks) {
        if (!spark.life) continue;
        const progress = spark.age / spark.life;
        const size = spark.size * (2.4 - progress * 1.25);
        context.globalAlpha = 1 - progress;
        context.drawImage(spark.sprite, spark.x - size / 2, spark.y - size / 2, size, size);
      }
      context.restore();
    }

    function drawBalls() {
      if (!launched) {
        drawBall(queuedBall.x, queuedBall.y, queuedBall.colorIndex, 0.85);
        return;
      }

      context.save();
      context.globalCompositeOperation = 'lighter';
      const spriteSize = BALL_RADIUS * 3.6;
      for (const body of balls) {
        context.drawImage(
          ballSprites[body.plugin.colorIndex],
          body.position.x - spriteSize / 2,
          body.position.y - spriteSize / 2,
          spriteSize,
          spriteSize
        );
      }
      context.restore();
    }

    function drawBall(x, y, colorIndex, alpha) {
      const spriteSize = BALL_RADIUS * 3.6;
      context.save();
      context.globalCompositeOperation = 'lighter';
      context.globalAlpha = alpha;
      context.drawImage(
        ballSprites[colorIndex],
        x - spriteSize / 2,
        y - spriteSize / 2,
        spriteSize,
        spriteSize
      );
      context.restore();
    }
  </script>
</body>
</html>
