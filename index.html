<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>NUMBER BURST</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030509;
    }
    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }
    #count {
      position: fixed;
      top: max(12px, 2.6vh);
      left: 0;
      right: 0;
      color: #ffffff;
      font-weight: 900;
      line-height: .92;
      letter-spacing: -.045em;
      font-variant-numeric: tabular-nums;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="count">0</div>
  <canvas id="stage"></canvas>

  <script>
    'use strict';

    const BOARD_WIDTH = 393;
    const BOARD_HEIGHT = 850;
    const BALL_RADIUS = 5.9;
    const SPLIT_COOLDOWN_MS = 500;
    const PHYSICS_STEPS = 2;
    const MAX_FRAME_DELTA_MS = 1000 / 60;
    const GRAVITY = 500;
    const MIN_SPEED = 80;
    const MAX_SPEED = 620;
    const RESTITUTION = 0.99;
    const GRID_CELL_SIZE = 44;
    const GRID_COLUMNS = Math.ceil(BOARD_WIDTH / GRID_CELL_SIZE);
    const GRID_ROWS = Math.ceil(BOARD_HEIGHT / GRID_CELL_SIZE);
    const DOUBLE_TAP_MS = 320;
    const DOUBLE_TAP_DISTANCE = 42;

    const canvas = document.getElementById('stage');
    const context = canvas.getContext('2d');
    const countElement = document.getElementById('count');
    const measurementContext = document.createElement('canvas').getContext('2d');
    const segments = [];
    const pegs = [];
    const balls = [];
    const cellWalls = new Array(GRID_COLUMNS * GRID_ROWS);
    const queuedBall = { x: BOARD_WIDTH * 0.5, y: 112 };

    let launched = false;
    let lastFrameTime = 0;
    let lastTapTime = 0;
    let lastTapX = 0;
    let lastTapY = 0;
    let lastTickTime = 0;
    let displayedCount = -1;
    let displayedTextLength = 0;
    let audioContext = null;
    let canvasWidth = 1;
    let canvasHeight = 1;
    let devicePixelRatio = 1;
    let boardScale = 1;
    let boardOffsetX = 0;
    let boardOffsetY = 0;
    let renderScale = 1;
    let renderOffsetX = 0;
    let renderOffsetY = 0;
    let segmentCount = 0;

    createWalls();
    segmentCount = segments.length;
    buildWallGrid();

    window.addEventListener('resize', resize, { passive: true });
    window.addEventListener('orientationchange', resize, { passive: true });
    window.addEventListener('pointerdown', handlePointerDown);
    window.addEventListener('contextmenu', event => event.preventDefault());

    resize();
    refreshCountDisplay(true);
    requestAnimationFrame(animationFrame);

    function createWalls() {
      addSegment(0, 0, BOARD_WIDTH, 0);
      addSegment(BOARD_WIDTH, 0, BOARD_WIDTH, BOARD_HEIGHT);
      addSegment(BOARD_WIDTH, BOARD_HEIGHT, 0, BOARD_HEIGHT);
      addSegment(0, BOARD_HEIGHT, 0, 0);

      addSegment(66, 204, 186, 151);
      addSegment(204, 330, 322, 382);
      addSegment(69, 501, 203, 553);
      addSegment(322, 678, 198, 634);

      addTriangle(186, 415, 54, -0.12);
      addTriangle(297, 586, 43, 0.16);

      addSegment(29, 456, 129, 456);
      addSegment(167, 456, 365, 456);

      addDiamond(198, 730, 51);

      addPeg(61, 118, 14);
      addPeg(333, 162, 10);
      addPeg(178, 274, 12);
      addPeg(77, 624, 18);
      addPeg(316, 781, 12);
      addPeg(196, 670, 9);
    }

    function addSegment(x1, y1, x2, y2) {
      segments.push({ x1, y1, x2, y2 });
    }

    function addPeg(cx, cy, r) {
      pegs.push({ cx, cy, r });
    }

    function addTriangle(cx, cy, radius, rotation) {
      const points = [];
      for (let index = 0; index < 3; index++) {
        const angle = rotation - Math.PI / 2 + index * Math.PI * 2 / 3;
        points.push({
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius
        });
      }
      for (let index = 0; index < points.length; index++) {
        const next = points[(index + 1) % points.length];
        addSegment(points[index].x, points[index].y, next.x, next.y);
      }
    }

    function addDiamond(cx, cy, halfSize) {
      addSegment(cx - halfSize, cy, cx, cy - halfSize);
      addSegment(cx, cy - halfSize, cx + halfSize, cy);
      addSegment(cx + halfSize, cy, cx, cy + halfSize);
      addSegment(cx, cy + halfSize, cx - halfSize, cy);
    }

    function buildWallGrid() {
      for (let index = 0; index < cellWalls.length; index++) {
        cellWalls[index] = [];
      }

      for (let segmentIndex = 0; segmentIndex < segments.length; segmentIndex++) {
        const segment = segments[segmentIndex];
        const minimumX = Math.min(segment.x1, segment.x2) - BALL_RADIUS;
        const maximumX = Math.max(segment.x1, segment.x2) + BALL_RADIUS;
        const minimumY = Math.min(segment.y1, segment.y2) - BALL_RADIUS;
        const maximumY = Math.max(segment.y1, segment.y2) + BALL_RADIUS;
        addWallToCells(segmentIndex, minimumX, maximumX, minimumY, maximumY);
      }

      for (let pegIndex = 0; pegIndex < pegs.length; pegIndex++) {
        const peg = pegs[pegIndex];
        const reach = BALL_RADIUS + peg.r;
        addWallToCells(
          segmentCount + pegIndex,
          peg.cx - reach,
          peg.cx + reach,
          peg.cy - reach,
          peg.cy + reach
        );
      }
    }

    function addWallToCells(wallIndex, minimumX, maximumX, minimumY, maximumY) {
      const firstColumn = clampToRange(Math.floor(minimumX / GRID_CELL_SIZE), 0, GRID_COLUMNS - 1);
      const lastColumn = clampToRange(Math.floor(maximumX / GRID_CELL_SIZE), 0, GRID_COLUMNS - 1);
      const firstRow = clampToRange(Math.floor(minimumY / GRID_CELL_SIZE), 0, GRID_ROWS - 1);
      const lastRow = clampToRange(Math.floor(maximumY / GRID_CELL_SIZE), 0, GRID_ROWS - 1);

      for (let row = firstRow; row <= lastRow; row++) {
        for (let column = firstColumn; column <= lastColumn; column++) {
          cellWalls[row * GRID_COLUMNS + column].push(wallIndex);
        }
      }
    }

    function handlePointerDown(event) {
      if (event.cancelable) event.preventDefault();
      ensureAudio();

      const now = performance.now();
      const tapDistance = Math.hypot(event.clientX - lastTapX, event.clientY - lastTapY);
      const isDoubleTap = launched &&
        now - lastTapTime <= DOUBLE_TAP_MS &&
        tapDistance <= DOUBLE_TAP_DISTANCE;

      if (isDoubleTap) {
        resetBalls();
        lastTapTime = 0;
        lastTapX = event.clientX;
        lastTapY = event.clientY;
        return;
      }

      lastTapTime = now;
      lastTapX = event.clientX;
      lastTapY = event.clientY;
      if (!launched) launchInitialBall(now);
    }

    function launchInitialBall(now) {
      const ball = {
        x: queuedBall.x,
        y: queuedBall.y,
        vx: randomRange(-150, 150),
        vy: randomRange(190, 280),
        lastSplit: now
      };
      limitBallSpeed(ball);
      balls.push(ball);
      launched = true;
    }

    function resetBalls() {
      balls.length = 0;
      launched = false;
      refreshCountDisplay(true);
    }

    function animationFrame(timestamp) {
      if (lastFrameTime === 0) lastFrameTime = timestamp;
      const frameDelta = Math.min(timestamp - lastFrameTime, MAX_FRAME_DELTA_MS);
      lastFrameTime = timestamp;

      updatePhysics(performance.now(), Math.max(frameDelta, 0) / 1000);
      draw();
      refreshCountDisplay(false);
      requestAnimationFrame(animationFrame);
    }

    function updatePhysics(now, frameDeltaSeconds) {
      const stepDelta = frameDeltaSeconds / PHYSICS_STEPS;
      for (let step = 0; step < PHYSICS_STEPS; step++) {
        const ballCount = balls.length;
        for (let index = 0; index < ballCount; index++) {
          const ball = balls[index];
          ball.vy += GRAVITY * stepDelta;
          ball.x += ball.vx * stepDelta;
          ball.y += ball.vy * stepDelta;
          collideWithWalls(ball, now);
          limitBallSpeed(ball);
        }
      }
    }

    function collideWithWalls(ball, now) {
      const column = clampToRange(
        Math.floor(ball.x / GRID_CELL_SIZE),
        0,
        GRID_COLUMNS - 1
      );
      const row = clampToRange(
        Math.floor(ball.y / GRID_CELL_SIZE),
        0,
        GRID_ROWS - 1
      );
      const walls = cellWalls[row * GRID_COLUMNS + column];

      for (let index = 0; index < walls.length; index++) {
        const wallIndex = walls[index];
        if (wallIndex < segmentCount) {
          collideWithSegment(ball, segments[wallIndex], now);
        } else {
          collideWithPeg(ball, pegs[wallIndex - segmentCount], now);
        }
      }
    }

    function collideWithSegment(ball, segment, now) {
      const deltaX = segment.x2 - segment.x1;
      const deltaY = segment.y2 - segment.y1;
      const lengthSquared = deltaX * deltaX + deltaY * deltaY;
      let position = (
        (ball.x - segment.x1) * deltaX +
        (ball.y - segment.y1) * deltaY
      ) / lengthSquared;
      position = clamp01(position);

      const closestX = segment.x1 + deltaX * position;
      const closestY = segment.y1 + deltaY * position;
      let normalX = ball.x - closestX;
      let normalY = ball.y - closestY;
      const distanceSquared = normalX * normalX + normalY * normalY;
      if (distanceSquared > BALL_RADIUS * BALL_RADIUS) return;

      const distance = Math.sqrt(distanceSquared);
      if (distance > 0.000001) {
        normalX /= distance;
        normalY /= distance;
      } else {
        const length = Math.sqrt(lengthSquared);
        normalX = -deltaY / length;
        normalY = deltaX / length;
      }

      const penetration = BALL_RADIUS - distance;
      ball.x += normalX * penetration;
      ball.y += normalY * penetration;
      reflectBall(ball, normalX, normalY);
      splitBall(ball, closestX, closestY, normalX, normalY, now);
    }

    function collideWithPeg(ball, peg, now) {
      let normalX = ball.x - peg.cx;
      let normalY = ball.y - peg.cy;
      const reach = BALL_RADIUS + peg.r;
      const distanceSquared = normalX * normalX + normalY * normalY;
      if (distanceSquared > reach * reach) return;

      const distance = Math.sqrt(distanceSquared);
      if (distance > 0.000001) {
        normalX /= distance;
        normalY /= distance;
      } else {
        const angle = Math.random() * Math.PI * 2;
        normalX = Math.cos(angle);
        normalY = Math.sin(angle);
      }

      const penetration = reach - distance;
      ball.x += normalX * penetration;
      ball.y += normalY * penetration;
      reflectBall(ball, normalX, normalY);
      splitBall(
        ball,
        peg.cx + normalX * peg.r,
        peg.cy + normalY * peg.r,
        normalX,
        normalY,
        now
      );
    }

    function reflectBall(ball, normalX, normalY) {
      const normalVelocity = ball.vx * normalX + ball.vy * normalY;
      if (normalVelocity >= 0) return;

      const impulse = -(1 + RESTITUTION) * normalVelocity;
      ball.vx += impulse * normalX;
      ball.vy += impulse * normalY;
    }

    function splitBall(ball, contactX, contactY, normalX, normalY, now) {
      if (now - ball.lastSplit < SPLIT_COOLDOWN_MS) return;

      ball.lastSplit = now;
      const child = {
        x: contactX + normalX * BALL_RADIUS * 1.25,
        y: contactY + normalY * BALL_RADIUS * 1.25,
        vx: ball.vx + randomRange(-55, 55),
        vy: ball.vy + randomRange(-45, 80),
        lastSplit: now
      };
      child.x = clampToRange(child.x, BALL_RADIUS, BOARD_WIDTH - BALL_RADIUS);
      child.y = clampToRange(child.y, BALL_RADIUS, BOARD_HEIGHT - BALL_RADIUS);
      limitBallSpeed(child);
      balls.push(child);
      playTick();
    }

    function limitBallSpeed(ball) {
      const speedSquared = ball.vx * ball.vx + ball.vy * ball.vy;
      if (speedSquared > MAX_SPEED * MAX_SPEED) {
        const scale = MAX_SPEED / Math.sqrt(speedSquared);
        ball.vx *= scale;
        ball.vy *= scale;
      } else if (speedSquared < MIN_SPEED * MIN_SPEED) {
        if (speedSquared < 0.000001) {
          const angle = Math.random() * Math.PI * 2;
          ball.vx = Math.cos(angle) * MIN_SPEED;
          ball.vy = Math.sin(angle) * MIN_SPEED;
        } else {
          const scale = MIN_SPEED / Math.sqrt(speedSquared);
          ball.vx *= scale;
          ball.vy *= scale;
        }
      }
    }

    function ensureAudio() {
      const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextConstructor) return;

      if (!audioContext) {
        try {
          audioContext = new AudioContextConstructor();
        } catch (error) {
          audioContext = null;
          return;
        }
      }

      if (audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }
    }

    function playTick() {
      if (!audioContext || audioContext.state !== 'running') return;
      const now = audioContext.currentTime;
      if (now - lastTickTime < 0.1) return;
      lastTickTime = now;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = 'triangle';
      oscillator.frequency.value = 560;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.025, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.08);
    }

    function draw() {
      context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      context.fillStyle = '#030509';
      context.fillRect(0, 0, canvasWidth, canvasHeight);

      context.setTransform(renderScale, 0, 0, renderScale, renderOffsetX, renderOffsetY);
      context.fillStyle = '#05070d';
      context.fillRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
      drawWalls();
      drawBalls();
    }

    function drawWalls() {
      context.strokeStyle = '#8fb6cf';
      context.lineWidth = 2.5;
      context.beginPath();
      for (const segment of segments) {
        context.moveTo(segment.x1, segment.y1);
        context.lineTo(segment.x2, segment.y2);
      }
      context.stroke();

      context.beginPath();
      for (const peg of pegs) {
        context.moveTo(peg.cx + peg.r, peg.cy);
        context.arc(peg.cx, peg.cy, peg.r, 0, Math.PI * 2);
      }
      context.stroke();
    }

    function drawBalls() {
      context.fillStyle = '#f4f8ff';
      context.beginPath();

      if (!launched) {
        context.moveTo(queuedBall.x + BALL_RADIUS, queuedBall.y);
        context.arc(queuedBall.x, queuedBall.y, BALL_RADIUS, 0, Math.PI * 2);
      } else {
        for (const ball of balls) {
          context.moveTo(ball.x + BALL_RADIUS, ball.y);
          context.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        }
      }

      context.fill();
    }

    function resize() {
      canvasWidth = window.innerWidth;
      canvasHeight = window.innerHeight;
      devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      boardScale = Math.min(canvasWidth / BOARD_WIDTH, canvasHeight / BOARD_HEIGHT);
      boardOffsetX = (canvasWidth - BOARD_WIDTH * boardScale) / 2;
      boardOffsetY = (canvasHeight - BOARD_HEIGHT * boardScale) / 2;
      renderScale = devicePixelRatio * boardScale;
      renderOffsetX = boardOffsetX * devicePixelRatio;
      renderOffsetY = boardOffsetY * devicePixelRatio;

      canvas.style.width = `${canvasWidth}px`;
      canvas.style.height = `${canvasHeight}px`;
      canvas.width = Math.max(1, Math.round(canvasWidth * devicePixelRatio));
      canvas.height = Math.max(1, Math.round(canvasHeight * devicePixelRatio));
      refreshCountDisplay(true);
    }

    function refreshCountDisplay(forceFit) {
      if (balls.length !== displayedCount) {
        displayedCount = balls.length;
        const text = displayedCount.toLocaleString('en-US');
        countElement.textContent = text;

        if (text.length !== displayedTextLength || forceFit) {
          displayedTextLength = text.length;
          fitCounter(text);
        }
      } else if (forceFit) {
        fitCounter(displayedCount.toLocaleString('en-US'));
      }
    }

    function fitCounter(text) {
      const availableWidth = Math.max(72, canvasWidth * 0.92);
      const maximumSize = Math.min(112, canvasHeight * 0.14);
      measurementContext.font = `900 ${maximumSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      const measuredWidth = measurementContext.measureText(text).width;
      const fontSize = measuredWidth > availableWidth
        ? Math.max(20, maximumSize * availableWidth / measuredWidth)
        : maximumSize;
      countElement.style.fontSize = `${fontSize.toFixed(2)}px`;
    }

    function randomRange(minimum, maximum) {
      return minimum + Math.random() * (maximum - minimum);
    }

    function clamp01(value) {
      return value < 0 ? 0 : value > 1 ? 1 : value;
    }

    function clampToRange(value, minimum, maximum) {
      return value < minimum ? minimum : value > maximum ? maximum : value;
    }
  </script>
</body>
</html>
